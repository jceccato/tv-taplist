name: Build and publish Docker image

on:
  push:
    branches: [main]
    # Skip a build for changes that cannot reach the image. This mirrors
    # .dockerignore, which excludes docs/ and every markdown file EXCEPT
    # README.md - so README is deliberately un-ignored here and still builds.
    # Path filters are not evaluated for tag pushes, so a release always builds
    # whatever it touched.
    #
    # A test workflow must NOT reuse this filter: .dockerignore also excludes
    # tests/, so a test-only change would skip running the tests (issue #30).
    paths-ignore:
      - "**.md"
      - "!README.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Releases on tag pushes
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagging policy (issue #24). There is ONE meaning of "released" and both
      # the registry and the in-app update checker use it: a v* tag.
      #
      #   :latest      only a v* tag push. This is what README, docker-compose,
      #                INSTALLATION and UNRAID all steer operators at, and it
      #                now delivers what those docs promise - the newest
      #                release, the same version the update checker names.
      #   :main        every merge to main. An unreleased canary for testing a
      #                merge before it is tagged; nobody is steered at it.
      #   :<short-sha> every build, for pinning an exact one.
      #   :vX.Y.Z      the release itself.
      #
      # Before this, :latest moved on every merge while the update checker only
      # moved on a tag, so an operator on :latest could be ahead of what the app
      # called newest. Note this is an inverted gate, not new machinery.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version || github.sha }}

      # On a v* tag push, publish a GitHub Release so the in-app update checker
      # (which reads the /releases/latest API) can detect new versions. A pushed
      # tag alone is not returned by that API. Uses the runner's preinstalled gh
      # CLI + the built-in GITHUB_TOKEN; --generate-notes builds notes from the
      # commits since the previous release, and --latest marks it as newest.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest
