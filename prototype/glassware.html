<!doctype html><meta charset="utf-8"><title>Glassware</title>
<style>
 :root { --bg:#131a22; --fg:#c9d3de; --line:#2c3846; }
 body.light { --bg:#f4f1ec; --fg:#333; --line:#cfc8bd; }
 body.oled { --bg:#000; --fg:#c9d3de; --line:#222; }
 body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
        font:13px system-ui,sans-serif; }
 h1 { font-size:16px; margin:0 0 2px; } p { opacity:.65; margin:0 0 14px; }
 table { border-collapse:collapse; }
 th, td { padding:6px 10px; text-align:center; vertical-align:bottom;
           border-bottom:1px solid var(--line); }
 th { font-weight:600; font-size:12px; } th.row { text-align:right; opacity:.7; }
 .seg { display:flex; gap:6px; margin-bottom:14px; }
 .seg button { padding:6px 12px; font:12px system-ui,sans-serif; cursor:pointer;
                background:transparent; color:var(--fg); border:1px solid var(--line);
                border-radius:5px; }
 .seg button[aria-pressed=true] { background:var(--fg); color:var(--bg); }
</style>
<body>
<h1>Glassware</h1>
<p>Every silhouette as the box actually renders it. * marks the default.</p>

  <button data-t="oled">oled</button>
</div>
